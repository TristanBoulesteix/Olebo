name: Qodana
on:
  workflow_dispatch:
  pull_request:


jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Create coverage data directory
        run: mkdir -p .qodana/code-coverage
      - name: Setup xvfb for screen 0
        run: Xvfb :1 -screen 0 1600x1200x24 &
      - name: Generate coverage report
        run: ./gradlew koverBinaryReport
        env:
          DISPLAY: :1
      - name: Tear down xvfb
        run: killall Xvfb
      - name: Move and rename coverage report
        run: cp build/reports/kover/report.bin .qodana/code-coverage/report.ic
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2023.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: --baseline,qodana.sarif.json